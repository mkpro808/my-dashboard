  else if(a==='gad'){var L1=curList(),gt=val('tt');if(L1&&gt){L1.items.unshift({id:'tmp'+uid(),title:gt,done:false});tkPost({op:'add',list:L1.id,title:gt});}}
  else if(a==='gtg'){var L2=curList();if(L2){var it2=find(L2.items,id);if(it2&&id.indexOf('tmp')!==0){it2.done=!it2.done;tkPost({op:'toggle',list:L2.id,id:id,done:it2.done});}}}
  else if(a==='gdl'){var L3=curList();if(L3&&id.indexOf('tmp')!==0){L3.items=not(L3.items,id);tkPost({op:'delete',list:L3.id,id:id});}}
  else if(a==='gcl'){var L4=curList();if(L4){L4.items=L4.items.filter(function(x){return !x.done;});tkPost({op:'clear',list:L4.id});}}
  else if(a==='gnl'){var nl=val('nl');if(nl&&GT())tkPost({op:'newlist',title:nl},function(){tkSel='';tasksLoad();});}
  else if(a==='gtog'&&GT()){var ci=find(TK.chores.items,id);if(ci){if(ci.done){var rc=S.cdone[id];if(rc){(rc.who||[rc.by]).forEach(function(pid){var q=find(S.people,pid);if(q)q.stars=Math.max(0,q.stars-rc.n);});slog(rc.who||[rc.by],-rc.n,'Undid '+parseChore(ci.title).name);}delete S.cdone[id];ci.done=false;pick='';msg='';tkPost({op:'toggle',list:ci.list,id:id,done:false});}else pick=(pick===id?'':id);}}
  else if(a==='gwho'&&GT()){var cw=find(TK.chores.items,id);var tp=t.getAttribute('data-p');p=tp==='team'?{id:'team',name:'Team'}:find(S.people,tp);if(cw&&p&&(tp!=='team'||S.people.length)){var pc2=parseChore(cw.title);pc2.n=ptsOf(cw);var who=tp==='team'?S.people.map(function(q){return q.id;}):[p.id];who.forEach(function(pid){var q=find(S.people,pid);if(q)q.stars+=pc2.n;});S.cdone[id]={on:T,by:p.id,n:pc2.n,who:who,at:Date.now()};slog(who,pc2.n,pc2.name+(tp==='team'?' (team)':''));cw.done=true;pick='';msg=(tp==='team'?'Team effort! Everyone':p.name)+' earned '+pc2.n+(pc2.n===1?' star':' stars')+' for '+pc2.name+'!';tkPost({op:'toggle',list:cw.list,id:id,done:true});}}
  else if(a==='gac'&&GT()){var cn2=val('cn'),cl2=val('cl')||TK.chores.id;if(cn2&&cl2){TK.chores.items.push({id:'tmp'+uid(),title:cn2,done:false,list:cl2});tkPost({op:'add',list:cl2,title:cn2});}}
  else if(a==='gdc'&&GT()){var cd=find(TK.chores.items,id);if(cd&&id.indexOf('tmp')!==0){TK.chores.items=not(TK.chores.items,id);tkPost({op:'delete',list:cd.list,id:id});}}
  else if(a==='lper'){S.gcfg.per=S.gcfg.per||{};S.gcfg.per[id]=t.getAttribute('data-w');setTimeout(tasksLoad,0);}
  else if(a==='lcfg'){if(!S.gcfg)S.gcfg={where:{}};S.gcfg.where[id]=t.getAttribute('data-w');setTimeout(tasksLoad,0);}
  else if(a==='addt'){var tx=val('tt');if(tx)S.tasks.push({id:uid(),text:tx,done:false});}
  else if(a==='tgt'){r=find(S.tasks,id);if(r)r.done=!r.done;}
  else if(a==='delt'){S.tasks=not(S.tasks,id);}
  else if(a==='clrt'){S.tasks=S.tasks.filter(function(x){return !x.done;});}
  else if(a==='addm'){var rt=val('rt');if(rt){var nr={id:uid(),text:rt,when:val('rw'),color:NF.c,at:Date.now()};if(NF.f)nr.for=NF.f;S.rem.push(nr);NF.f='';}else{toast('Write something on the note first.');return;}}
  else if(a==='ncol'){NF.c=id;var tx=document.getElementById('rt'),keep=tx?tx.value:'',dw=val('rw');render();var t2=document.getElementById('rt');if(t2){t2.value=keep;}var w2=document.getElementById('rw');if(w2)w2.value=dw;return;}
  else if(a==='nfor'){NF.f=id;var tx2=document.getElementById('rt'),keep2=tx2?tx2.value:'',dw2=val('rw');render();var t3=document.getElementById('rt');if(t3)t3.value=keep2;var w3=document.getElementById('rw');if(w3)w3.value=dw2;return;}
  else if(a==='delm'){var dn=find(S.rem,id);if(dn){var el=t.closest('.note'),can=document.getElementById('tcan');
      var go=function(){S.rem=not(S.rem,id);dn.doneAt=Date.now();S.remDone=(S.remDone||[]).concat([dn]);save();render();var c2=document.getElementById('tcan');if(c2){c2.classList.remove('bump');void c2.offsetWidth;c2.classList.add('bump');}};
      if(el&&can&&el.animate){var a1=el.getBoundingClientRect(),b1=can.getBoundingClientRect();
        el.animate([{transform:getComputedStyle(el).transform,opacity:1},{transform:'translate('+(b1.left+b1.width/2-a1.left-a1.width/2)+'px,'+(b1.top+b1.height/2-a1.top-a1.height/2)+'px) scale(.08) rotate(200deg)',opacity:.4}],{duration:520,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'}).onfinish=go;}
      else go();}return;}
  else if(a==='trash'){trash=!trash;armed='';}
  else if(a==='trest'){var tr=find(S.remDone||[],id);if(tr){S.remDone=not(S.remDone,id);delete tr.doneAt;S.rem.push(tr);toast('Back on the board.');}}
  else if(a==='tdel2'){S.remDone=not(S.remDone||[],id);}
  else if(a==='tempty'){if(armed==='tempty'){S.remDone=[];armed='';}else{armed='tempty';}}
  else if(a==='edit'){edit=!edit;pick='';hist=false;}
  else if(a==='hist'){hist=!hist;edit=false;pick='';}
  else if(a==='hf'){var kv=id.split(':');HF[kv[0]]=kv[1];}
  else if(a==='tog'){c=find(S.chores,id);if(c){if(c.doneOn===T){p=find(S.people,c.doneBy);if(p){p.stars=Math.max(0,p.stars-c.stars);slog([p.id],-c.stars,'Undid '+c.name);}c.doneOn='';c.doneBy='';pick='';msg='';}else pick=(pick===id?'':id);}}
  else if(a==='who'){c=find(S.chores,id);p=find(S.people,t.getAttribute('data-p'));if(c&&p){c.doneOn=T;c.doneBy=p.id;p.stars+=c.stars;slog([p.id],c.stars,c.name);pick='';msg=p.name+' earned '+c.stars+(c.stars===1?' star':' stars')+' for '+c.name+'!';}}
  else if(a==='delc'){S.chores=not(S.chores,id);}
  else if(a==='addc'){var n2=val('cn');if(n2)S.chores.push({id:uid(),name:n2,stars:Math.max(1,parseInt(val('cs'),10)||1),doneOn:'',doneBy:''});}
  else if(a==='adj'){p=find(S.people,id);if(p){var dn=parseInt(t.getAttribute('data-n'),10),b4=p.stars;p.stars=Math.max(0,p.stars+dn);if(p.stars!==b4)slog([p.id],p.stars-b4,'Manual adjustment');}}
  else if(a==='delp'){if(armed===id){S.people=not(S.people,id);armed='';}else armed=id;}
  else if(a==='addp'){var nm=val('pn');if(nm)S.people.push({id:uid(),name:nm,color:COLORS[S.people.length%COLORS.length],stars:0});}
  else if(a==='addr'){var rn=val('rn');if(rn)S.rewards.push({id:uid(),name:rn,cost:Math.max(1,parseInt(val('rc'),10)||1)});}
  else if(a==='delr'){S.rewards=not(S.rewards,id);}
  else if(a==='red'){r=find(S.rewards,id);p=find(S.people,t.getAttribute('data-p'));if(r&&p&&p.stars>=r.cost){p.stars-=r.cost;msg=p.name+' redeemed '+r.name+'! 🎉';}}
  if(JSON.stringify(S)!==before)save();
  render();
}
