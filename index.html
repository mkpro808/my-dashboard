<!DOCTYPE html>
<html lang="en">

<style>

:root[data-theme="dark"]{--bg:#15161b;--card:#1f2027;--ink:#f1f2f6;--mute:#9a9eab;--line:#31333d;--side:#101116;--on:#1f2027}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex}

.nb b{display:block;height:32px;margin:0 auto 4px}.nb svg{display:block;margin:0 auto}.nb{--ic:#f4a261;opacity:.72}.nb.on{opacity:1}
.nb.on{background:var(--on);color:var(--ink);font-weight:700}

#wx{font-size:22px;margin-left:18px}#sun{font-size:18px;margin-left:16px;color:var(--mute);display:flex;align-items:center;white-space:nowrap}#sun svg{margin-right:6px}#sun b{color:var(--ink);font-weight:600;margin-left:5px}

h1{font-size:24px;margin:0}
h3{font-size:18px;margin:16px 0 8px}

.msg{min-height:24px;font-weight:600;color:var(--ok)}

.vs{display:flex;overflow-x:auto;flex:1;min-width:0;margin:0 12px;scrollbar-width:none}

.clab{font-size:17px;white-space:nowrap;flex:none}

.chip{display:block;font-size:12px;border-radius:5px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.ar{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid;border-radius:10px;padding:12px 14px;margin:6px 0;cursor:pointer}
@media (max-width:700px){header{height:auto;flex-wrap:wrap;position:static}#ttl{width:100%;font-size:22px}#clk{margin-left:0;font-size:30px}#sun{display:none}.ctop{position:static;height:auto;flex-wrap:wrap;margin:0 -18px;padding:8px 18px}.vs{order:3;flex-basis:100%;margin:8px 0 0}.dh,.tl .sp{position:static}.ar .tm{width:110px}}
.ar .tm{width:170px;color:var(--mute);font-size:15px;flex:none}.ar .tt{font-size:18px}
header{height:76px;box-sizing:border-box}
.dh b{display:inline-block;min-width:34px;height:34px;line-height:34px;border-radius:17px;font-weight:600}
.dh.t b{background:#e5654b;color:#fff}
.db{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 50px}

.mo{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:100%;overflow-y:auto;box-sizing:border-box}
.mo h3{margin-top:0}
.slp{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;color:#555;z-index:30;display:flex;align-items:center;justify-content:center;font-size:18px}
.it{display:flex;align-items:center;min-height:52px;background:var(--card);border:2px solid var(--line);border-radius:14px;margin:6px 0;padding:4px 10px;cursor:pointer}
.it.done{background:rgba(22,163,74,.15);border-color:var(--ok)}
.it.done .cn{text-decoration:line-through;color:var(--mute)}
.it.late{border-color:#ef4444}
.chk{width:30px;height:30px;line-height:30px;text-align:center;border:2px solid var(--mute);border-radius:50%;margin-right:12px;font-weight:700;flex:none}
.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.cn{flex:1;font-size:19px}
.cs{font-weight:700;margin-left:8px;white-space:nowrap}
.who{padding:6px 0 4px 42px}
.wb{margin:3px 8px 3px 0;border-width:3px}
.score{display:flex;flex-wrap:wrap;margin:0 -5px}
.sc{flex:1 1 140px;margin:5px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:14px;padding:10px 14px;box-sizing:border-box}
.sn{font-size:20px;font-weight:700}.ss{font-size:28px;font-weight:700}
.rw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.rt{font-size:18px;font-weight:600;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:16px;z-index:40;max-width:80%;text-align:center;display:none;cursor:pointer}
.gst{font-size:13px;color:var(--mute);margin-left:12px;font-weight:400}
.ev.g{border-left-style:solid}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="mn"><header><div id="ttl"></div><div id="clk"></div><div id="wx"></div><div id="sun"></div><div class="av" id="av"></div></header><div id="app"></div></main>
<div id="ovl"></div><div id="toast" data-a="toast"></div>
<script>
var KEY='chorestars.v2', COLORS=['#f59e0b','#3b82f6','#ec4899','#10b981','#8b5cf6','#ef4444'];
var TABS=[['cal','Calendar'],['chores','Chores'],['tasks','Lists'],['rem','Reminders']];
var ICON={cal:'<rect x="7.5" y="9.5" width="21" height="19" rx="4" fill="var(--ic)"/><rect x="4.5" y="7" width="21" height="19.5" rx="4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M4.5 13h21M10 4.5v5M20 4.5v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M10 18.5h.1M15 18.5h.1M20 18.5h.1M10 22.5h.1M15 22.5h.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="2.8"/>',chores:'<polygon points="17.5,6.0 20.6,13.8 28.9,14.3 22.4,19.6 24.6,27.7 17.5,23.2 10.4,27.7 12.6,19.6 6.1,14.3 14.4,13.8" fill="var(--ic)"/><polygon points="15.5,4.0 18.6,11.8 26.9,12.3 20.4,17.6 22.6,25.7 15.5,21.2 8.4,25.7 10.6,17.6 4.1,12.3 12.4,11.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',tasks:'<rect x="8.5" y="8.5" width="19" height="21" rx="3.5" fill="var(--ic)"/><rect x="5.5" y="6" width="19" height="21.5" rx="3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M11 4.5h8v4h-8z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M9.5 14.5l2 2 3.5-3.5M9.5 21.5l2 2 3.5-3.5M18 15.5h3M18 22.5h3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',rem:'<path d="M18 7.5c4.6 0 7.5 3.4 7.5 8v4.5l2.5 4H8l2.5-4V15.5c0-4.6 2.9-8 7.5-8z" fill="var(--ic)"/><path d="M15.5 5.5c4.6 0 7.5 3.4 7.5 8V18l2.5 4H5.5L8 18v-4.5c0-4.6 2.9-8 7.5-8zM12.5 25.5a3 3 0 0 0 6 0M15.5 3v2.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',sleep:'<path d="M23.5 21.5A10 10 0 0 1 13 7.5a10 10 0 1 0 12.5 12.6" fill="var(--ic)" transform="translate(2.5 2)"/><path d="M23.5 21.5A10 10 0 0 1 13 7.5a10 10 0 1 0 12.5 12.6z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M23 5v4M21 7h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="1.8"/>'};
function ico(k,sz){return '<svg viewBox="0 0 32 32" width="'+(sz||30)+'" height="'+(sz||30)+'" aria-hidden="true">'+ICON[k]+'</svg>';}
var STAR='<svg viewBox="0 0 32 32" width="1em" height="1em" style="vertical-align:-0.12em" aria-hidden="true"><polygon points="16.0,3.5 19.3,12.0 28.4,12.5 21.3,18.2 23.6,27.0 16.0,22.1 8.4,27.0 10.7,18.2 3.6,12.5 12.7,12.0" fill="var(--ic)" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>';

var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var CALCOL={jericho:'#3b82f6',kahoku:'#a78bfa',ohana:'#7e22ce'};
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], H0=7, H1=22, PX=50, DEFTITLE='Sombrio Ohana';
var TK=null, tkSel='', api=/^https?:$/.test(location.protocol), ver=0, busy=false, dirty=false, failed=false, pushT=null, GE=[], gErr=[], gN=-1, toastT=null;
var tab='cal', edit=false, armed='', pick='', msg='', S, mo=null, wkStart=iso(new Date()), toNow=true;
function p2(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function mins(t){var a=t.split(':');return parseInt(a[0],10)*60+parseInt(a[1],10);}
function hhmm(m){return p2(Math.floor(m/60)%24)+':'+p2(m%60);}
function tf(t){var m=mins(t),h=Math.floor(m/60),ap=h<12?'AM':'PM';h=h%12||12;return h+(m%60?':'+p2(m%60):'')+' '+ap;}
function uid(){return 'i'+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function seed(){
  var c=[['Wash the dishes',2],['Take out the trash',2],['Do a load of laundry',3],['Vacuum the living room',3],['Wipe the counters',1],['Water the plants',1]];
  return {people:[{id:uid(),name:'Jericho',color:COLORS[0],stars:0},{id:uid(),name:'Kahoku',color:COLORS[1],stars:0}],
    chores:c.map(function(x){return {id:uid(),name:x[0],stars:x[1],doneOn:'',doneBy:''};}),
    rewards:[{id:uid(),name:'Pick the movie',cost:8},{id:uid(),name:'Treat of your choice',cost:12},{id:uid(),name:'Skip a chore',cost:15}]};}
function norm(s){s=s||seed();s.people=s.people||[];s.chores=s.chores||[];s.rewards=s.rewards||[];s.events=s.events||[];s.tasks=s.tasks||[];s.rem=s.rem||[];s.title=s.title||DEFTITLE;s.cdone=s.cdone||{};if(!s.colorsV1){s.colorsV1=1;s.people.forEach(function(p){var c=CALCOL[String(p.name).toLowerCase()];if(c)p.color=c;});}return s;}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}return norm(s);}
function cache(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){cache();if(!api)return;dirty=true;clearTimeout(pushT);pushT=setTimeout(push,300);}
function toast(t,ms){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toastT);if(ms!==0)toastT=setTimeout(function(){el.style.display='none';},ms||4000);}
function getJSON(u){return fetch(u,{cache:'no-store',credentials:'same-origin'}).then(function(r){var ct=r.headers.get('content-type')||'';if(r.redirected||ct.indexOf('json')<0)throw new Error('auth');return r.json().then(function(j){return {s:r.status,j:j};});});}
function busyUI(){var a=document.activeElement;return !!(mo||pick||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)));}
function rr(){var m=document.getElementById('mn'),y=m.scrollTop;render();m.scrollTop=y;}
function push(){
  if(!api)return; if(busy){return;} busy=true; dirty=false;
  fetch('/api/state',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:S,version:ver})})
  .then(function(r){var ct=r.headers.get('content-type')||'';if(r.redirected||ct.indexOf('json')<0)throw new Error('auth');return r.json().then(function(j){
    failed=false;
    if(r.status===200){ver=j.version;}
    else if(r.status===409){if(j.data){S=norm(j.data);ver=j.version;cache();}dirty=false;toast('Someone just changed this on another device. Please try that again.');rr();}
    else if(r.status===503){api=false;}
    else throw new Error('save');});})
  .catch(function(e){dirty=true;failed=true;if(e.message==='auth')toast('Your sign-in expired. Tap here to sign in again.',0);})
  .then(function(){busy=false;if(dirty)setTimeout(push,failed?15000:50);});
}
function pull(first){
  if(!api||busy||dirty)return;
  getJSON('/api/state').then(function(x){
    if(x.s===503){api=false;return;} if(x.s!==200)return;
    if(x.j.data===null){if(first){ver=0;dirty=true;push();}return;}
    if(x.j.version!==ver){S=norm(x.j.data);ver=x.j.version;cache();if(!busyUI())rr();}
  }).catch(function(e){if(e.message==='auth')toast('Your sign-in expired. Tap here to sign in again.',0);});
}
function gcal(){
  if(!api)return;
  getJSON('/api/calendar').then(function(x){if(x.s!==200)return;GE=x.j.events||[];gErr=x.j.errors||[];gN=x.j.calendars||0;if(tab==='cal'&&!busyUI())rr();}).catch(function(){});
}
function pid(name){for(var i=0;i<S.people.length;i++){if(S.people[i].name.toLowerCase()===String(name||'').toLowerCase())return S.people[i].id;}return '';}
function find(a,id){for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}return null;}
function val(id){var el=document.getElementById(id);return el?el.value.replace(/^\s+|\s+$/g,''):'';}
function not(a,id){return a.filter(function(x){return x.id!==id;});}
function pc(id){var p=find(S.people,id);return p?p.color:'#8b5cf6';}

var SUN=null;
function sunIco(up){return '<svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M8.5 22.5a9.5 9.5 0 0 1 19 0z" fill="var(--ic)"/><path d="M6.5 21a9.5 9.5 0 0 1 19 0M3 25h26M16 3.5v6'+(up?'M12.5 6.5l3.5-3.5 3.5 3.5':'M12.5 6.5l3.5 3.5 3.5-3.5')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';}
function sunText(){
  if(!SUN||!SUN.rise||!SUN.set)return '';
  var d=new Date(),now=iso(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes()),k,up;
  if(now<SUN.rise[0]){k=SUN.rise[0];up=1;}else if(now<SUN.set[0]){k=SUN.set[0];up=0;}else{k=SUN.rise[1];up=1;}
  if(!k)return '';
  return sunIco(up)+(up?'Sunrise':'Sunset')+'<b>'+tf(k.slice(11,16))+'</b>';}
function clock(){var d=new Date(),h=d.getHours()%12||12;document.getElementById('clk').innerHTML=h+':'+p2(d.getMinutes())+'<small>'+(d.getHours()<12?'AM':'PM')+'</small>';document.getElementById('sun').innerHTML=sunText();}
function wx(){try{fetch('https://api.open-meteo.com/v1/forecast?latitude=21.3&longitude=-157.8&current=temperature_2m,weather_code&daily=sunrise,sunset&timezone=auto&forecast_days=2&temperature_unit=fahrenheit')
  .then(function(r){return r.json();}).then(function(j){var c=j.current.weather_code,e=c===0?'☀️':c<4?'⛅':c<50?'🌫️':c<70?'🌧️':c<80?'❄️':c<90?'🌦️':'⛈️';
  document.getElementById('wx').textContent=e+' '+Math.round(j.current.temperature_2m)+'°';if(j.daily&&j.daily.sunrise&&j.daily.sunset){SUN={rise:j.daily.sunrise,set:j.daily.sunset};clock();}}).catch(function(){});}catch(e){}}

function dayEvents(k){
  var a=S.events.filter(function(e){return e.date===k;});
  GE.forEach(function(g){if(g.date===k)a.push({id:'g:'+g.id,title:g.title,date:g.date,time:g.time,end:g.end,who:pid(g.cal),col:CALCOL[String(g.cal).toLowerCase()],g:1});});
  return a;}
var VIEWS=[['1','Day'],['3','3 Days'],['4','4 Days'],['7','Week'],['14','2 Weeks'],['m','Month'],['a','Schedule']];
var calView=(function(){try{var v=localStorage.getItem('calView');for(var i=0;i<VIEWS.length;i++)if(VIEWS[i][0]===v)return v;}catch(e){}return window.innerWidth<700?'1':'4';})();
function sunday(k){var d=new Date(k+'T12:00:00');return addDays(k,-d.getDay());}
function firstOfMonth(k){return k.slice(0,8)+'01';}
function sortEv(a){return a.slice().sort(function(x,y){if(!x.time!==!y.time)return x.time?1:-1;return (x.time||'').localeCompare(y.time||'');});}
function calRange(){
  if(calView==='7')return {start:sunday(wkStart),n:7};
  if(calView==='14')return {start:sunday(wkStart),n:14};
  if(calView==='m'){var f=firstOfMonth(wkStart),st=sunday(f),dim=new Date(+f.slice(0,4),+f.slice(5,7),0).getDate(),off=new Date(f+'T12:00:00').getDay();return {start:st,n:Math.ceil((off+dim)/7)*7,month:+f.slice(5,7)-1};}
  if(calView==='a')return {start:wkStart,n:14};
  return {start:wkStart,n:+calView};}
function calLabel(r){
  if(calView==='m'){var f=new Date(firstOfMonth(wkStart)+'T12:00:00');return MN[f.getMonth()]+' '+f.getFullYear();}
  var a=new Date(r.start+'T12:00:00'),b=new Date(addDays(r.start,r.n-1)+'T12:00:00');
  if(r.n===1)return DN[a.getDay()]+', '+MN[a.getMonth()]+' '+a.getDate();
  if(a.getMonth()===b.getMonth())return MN[a.getMonth()]+' '+a.getFullYear();
  return MN[a.getMonth()].slice(0,3)+' – '+MN[b.getMonth()].slice(0,3)+' '+b.getFullYear();}
function chip(e){var c=e.col||pc(e.who);return '<span class="chip" data-a="evt" data-i="'+esc(e.id)+'" style="background:'+c+'26;border-color:'+c+'">'+(e.time?'<b>'+tf(e.time).replace(':00','').replace(' ','').toLowerCase()+'</b> ':'')+esc(e.title)+'</span>';}
function vGrid(r,max){
  var T=iso(new Date()),h='<div class="mg">';
  DN.forEach(function(w){h+='<div class="mh">'+w+'</div>';});
  for(var i=0;i<r.n;i++){var k=addDays(r.start,i),d=new Date(k+'T12:00:00'),ev=sortEv(dayEvents(k));
    var out=r.month!==undefined&&d.getMonth()!==r.month;
    h+='<div class="mc'+(k===T?' t':'')+(out?' o':'')+'" data-a="gday" data-d="'+k+'" style="min-height:'+(calView==='14'?220:104)+'px"><span class="dn">'+d.getDate()+'</span>';
    ev.slice(0,max).forEach(function(e){h+=chip(e);});
    if(ev.length>max)h+='<span class="sub">+'+(ev.length-max)+' more</span>';
    h+='</div>';}
  return h+'</div>';}
function vAgenda(r){
  var T=iso(new Date()),h='',any=false;
  for(var i=0;i<r.n;i++){var k=addDays(r.start,i),ev=sortEv(dayEvents(k));if(!ev.length)continue;any=true;
    var d=new Date(k+'T12:00:00');
    h+='<h3 style="margin-top:18px">'+(k===T?'Today · ':'')+DN[d.getDay()]+', '+MN[d.getMonth()]+' '+d.getDate()+'</h3>';
    ev.forEach(function(e){var c=e.col||pc(e.who);h+='<div class="ar" data-a="evt" data-i="'+esc(e.id)+'" style="border-left-color:'+c+'"><span class="tm">'+(e.time?tf(e.time)+(e.end?' – '+tf(e.end):''):'All day')+'</span><span class="tt">'+esc(e.title)+'</span></div>';});}
  return any?h:'<p class="hint" style="margin-top:18px">Nothing scheduled for these two weeks.</p>';}
function vCal(){
  var r=calRange(), T=iso(new Date()), nd=new Date(), nm=nd.getHours()*60+nd.getMinutes(), h, hr, grid=(calView==='m'||calView==='14');
  var gs=!api?'':gN===0?'Google Calendar not connected yet':gErr.length?'Couldn’t load: '+gErr.join(', '):'';
  h='<div class="ctop"><div style="flex:none"><button data-a="wk" data-n="-1">◀</button><button data-a="wk" data-n="0">Today</button><button data-a="wk" data-n="1">▶</button></div><div class="vs">';
  VIEWS.forEach(function(v){h+='<button data-a="cv" data-i="'+v[0]+'"'+(v[0]===calView?' class="on"':'')+'>'+v[1]+'</button>';});
  h+='</div><b class="clab">'+calLabel(r)+(gs?'<span class="gst">'+esc(gs)+'</span>':'')+'</b></div>';
  if(calView==='a')return h+vAgenda(r)+'<button class="fab" data-a="new">+</button>';
  if(grid)return h+vGrid(r,calView==='14'?7:3)+'<button class="fab" data-a="new">+</button>';
  var days=[];for(var i=0;i<r.n;i++)days.push(addDays(r.start,i));
  H0=7;H1=22;days.forEach(function(k){dayEvents(k).forEach(function(e){if(!e.time)return;var s=mins(e.time),en=e.end?mins(e.end):s+60;H0=Math.min(H0,Math.floor(s/60));H1=Math.max(H1,Math.min(24,Math.ceil(en/60)));});});
  var nAD=0;days.forEach(function(k){nAD=Math.max(nAD,dayEvents(k).filter(function(e){return !e.time;}).length);});var dhH=Math.max(66,46+nAD*19);
  h+='<div class="sch"><div class="tl"><div class="sp" style="height:'+(dhH+1)+'px"></div>';
  for(hr=H0;hr<H1;hr++)h+='<div>'+(hr%12||12)+' '+(hr<12?'AM':'PM')+'</div>';
  h+='</div>';
  days.forEach(function(k){
    var dd=new Date(k+'T12:00:00'), ev=dayEvents(k);
    h+='<div class="dc"><div class="dh'+(k===T?' t':'')+'" style="height:'+dhH+'px">'+DN[dd.getDay()]+' <b>'+dd.getDate()+'</b>';
    ev.filter(function(e){return !e.time;}).forEach(function(e){h+='<span class="ad" data-a="evt" data-i="'+esc(e.id)+'" style="background:'+(e.col||pc(e.who))+'33">'+esc(e.title)+'</span>';});
    h+='</div><div class="db" data-a="newat" data-d="'+k+'" style="height:'+((H1-H0)*PX)+'px">';
    var tl=ev.filter(function(e){return e.time;}).map(function(e){var s=mins(e.time),en=e.end?mins(e.end):s+60;if(en<=s)en=s+30;return {e:e,s:s,en:en};}).sort(function(a,b){return a.s-b.s||b.en-a.en;});
    var grp=null,gEnd=-1;
    tl.forEach(function(x){if(x.s>=gEnd){grp={lanes:[],items:[]};gEnd=x.en;}else gEnd=Math.max(gEnd,x.en);var l=0;while(grp.lanes[l]>x.s)l++;grp.lanes[l]=x.en;x.l=l;x.g=grp;grp.items.push(x);});
    tl.forEach(function(x){
      var e=x.e, n=x.g.lanes.length, top=(x.s-H0*60)/60*PX, ht=Math.max(30,(x.en-x.s)/60*PX), c=e.col||pc(e.who);
      h+='<div class="ev'+(e.g?' g':'')+'" data-a="evt" data-i="'+esc(e.id)+'" style="top:'+top+'px;height:'+ht+'px;left:calc('+(x.l*100/n)+'% + 2px);width:calc('+(100/n)+'% - 4px);right:auto;background:'+c+'33;border-color:'+c+'"><b>'+esc(e.title)+'</b><br><span class="sub">'+tf(e.time)+(e.end?' - '+tf(e.end):'')+'</span></div>';});
    if(k===T&&nm>=H0*60&&nm<H1*60)h+='<div class="nl" style="top:'+((nm-H0*60)/60*PX)+'px"></div>';
    h+='</div></div>';});
  return h+'</div><button class="fab" data-a="new">+</button>';}

function GT(){return !!(TK&&TK.connected&&TK.chores&&!TK.error);}
function parseChore(t){var m=String(t||'').match(/^(.*?)\s*\((\d+)\s*(?:\u2B50|stars?)?\)\s*$/i);return m?{name:m[1]||t,n:Math.max(1,parseInt(m[2],10))}:{name:t||'(untitled)',n:1};}
function where(id){return (S.gcfg&&S.gcfg.where[id])||'lists';}
function tasksLoad(){
  if(!api)return;
  var q='';if(S.gcfg){var ids=[];for(var k0 in S.gcfg.where)if(S.gcfg.where[k0]==='chores')ids.push(k0);q='?chores='+encodeURIComponent(ids.join(','));}
  getJSON('/api/tasks'+q).then(function(x){
    var j=x.j; TK=(x.s===503)?{connected:false,configured:false}:j;
    if(TK.connected&&!TK.error&&TK.lists){
      var ch=false,T=today();
      if(!S.gcfg){S.gcfg={where:{}};(TK.choreIds||[]).forEach(function(id){S.gcfg.where[id]='chores';});ch=true;}
      var cl=TK.lists.filter(function(l){return where(l.id)==='chores';}), items=[];
      cl.forEach(function(l){l.items.forEach(function(it){it.list=l.id;items.push(it);});});
      TK.chores={id:cl.length?cl[0].id:'',items:items,lists:cl};
      TK.shown=TK.lists.filter(function(l){return where(l.id)==='lists';}).map(function(l){return {id:l.id,title:l.title,items:l.items.filter(function(t){return !t.hidden;})};});
      for(var k in S.cdone){if(S.cdone[k].on!==T){delete S.cdone[k];ch=true;}}
      if(TK.created&&TK.chores.id&&items.length===0&&S.chores.length&&!S.choresMoved){S.choresMoved=true;ch=true;
        var qq=S.chores.slice(),cid=TK.chores.id;(function next(){var c=qq.shift();if(!c){tasksLoad();return;}tkPost({op:'add',list:cid,title:c.name+' ('+c.stars+')'},next);})();}
      if(ch)save();

    }
    if((tab==='tasks'||tab==='chores')&&!busyUI())rr();
  }).catch(function(e){if(e.message==='auth')toast('Your sign-in expired. Tap here to sign in again.',0);});
}
function tkPost(body,done){
  fetch('/api/tasks',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(j.error||'Google Tasks error');return j;});})
  .then(function(){if(done)done();else tasksLoad();})
  .catch(function(e){toast('Couldn\u2019t update Google Tasks. '+e.message);tasksLoad();});
}

function act(a,t){
  var id=t.getAttribute('data-i')||'', T=today(), c, p, r, before=JSON.stringify(S);
  if(a!=='tog'&&a!=='who')msg='';
  if(a!=='delp')armed='';
  if(a==='tab'){tab=id;edit=false;pick='';toNow=(id==='cal');if(id==='tasks'||id==='chores')tasksLoad();}
  else if(a==='sleep'){var s=document.createElement('div');s.className='slp';s.textContent='Tap to wake';s.onclick=function(){document.body.removeChild(s);};document.body.appendChild(s);return;}
  else if(a==='wk'){var n=parseInt(t.getAttribute('data-n'),10);if(!n){wkStart=iso(new Date());toNow=true;}
    else if(calView==='m'){var fm=new Date(firstOfMonth(wkStart)+'T12:00:00');fm.setMonth(fm.getMonth()+n);wkStart=iso(fm);}
    else wkStart=addDays(wkStart,n*(calView==='a'?14:+calView));}
  else if(a==='cv'){calView=id;toNow=true;try{localStorage.setItem('calView',id);}catch(e){}}
  else if(a==='gday'){wkStart=t.getAttribute('data-d');calView='1';toNow=true;try{localStorage.setItem('calView','1');}catch(e){}}
  else if(a==='new'){var rg=calRange(),td=iso(new Date());openMo(null,(td>=rg.start&&td<=addDays(rg.start,rg.n-1))?td:(calView==='m'?firstOfMonth(wkStart):rg.start));}
  else if(a==='newat'){return;}
  else if(a==='evt'){if(id.indexOf('g:')===0){var gg=find(GE,id.slice(2));if(gg)mo={ro:true,g:gg};}else openMo(find(S.events,id));}
  else if(a==='toast'){document.getElementById('toast').style.display='none';if(/sign-in/.test(t.textContent))location.reload();return;}
  else if(a==='mcl'){mo=null;}
  else if(a==='mdl'){S.events=not(S.events,mo.id);mo=null;}
  else if(a==='msv'){var ti=val('mt');if(ti){var st=val('ms'),en=val('me');if(st&&!en)en=hhmm(mins(st)+60);if(!st)en='';
    var o={id:mo.id||uid(),title:ti,date:val('md')||mo.date,time:st,end:en,who:document.getElementById('mw').value};
    if(mo.id)S.events=S.events.map(function(x){return x.id===o.id?o:x;});else S.events.push(o);mo=null;}}
  else if(a==='gconnect'){location.href='/api/google/connect';return;}
  else if(a==='tsel'){tkSel=id;}
  else if(a==='gad'){var L1=curList(),gt=val('tt');if(L1&&gt){L1.items.unshift({id:'tmp'+uid(),title:gt,done:false});tkPost({op:'add',list:L1.id,title:gt});}}
  else if(a==='gtg'){var L2=curList();if(L2){var it2=find(L2.items,id);if(it2&&id.indexOf('tmp')!==0){it2.done=!it2.done;tkPost({op:'toggle',list:L2.id,id:id,done:it2.done});}}}
  else if(a==='gdl'){var L3=curList();if(L3&&id.indexOf('tmp')!==0){L3.items=not(L3.items,id);tkPost({op:'delete',list:L3.id,id:id});}}
  else if(a==='gcl'){var L4=curList();if(L4){L4.items=L4.items.filter(function(x){return !x.done;});tkPost({op:'clear',list:L4.id});}}
  else if(a==='gnl'){var nl=val('nl');if(nl&&GT())tkPost({op:'newlist',title:nl},function(){tkSel='';tasksLoad();});}
  else if(a==='gtog'&&GT()){var ci=find(TK.chores.items,id);if(ci){if(ci.done){var rc=S.cdone[id];if(rc&&rc.on===T){p=find(S.people,rc.by);if(p)p.stars=Math.max(0,p.stars-rc.n);}delete S.cdone[id];ci.done=false;pick='';msg='';tkPost({op:'toggle',list:ci.list,id:id,done:false});}else pick=(pick===id?'':id);}}
  else if(a==='gwho'&&GT()){var cw=find(TK.chores.items,id);p=find(S.people,t.getAttribute('data-p'));if(cw&&p){var pc2=parseChore(cw.title);p.stars+=pc2.n;S.cdone[id]={on:T,by:p.id,n:pc2.n};cw.done=true;pick='';msg=p.name+' earned '+pc2.n+(pc2.n===1?' star':' stars')+' for '+pc2.name+'!';tkPost({op:'toggle',list:cw.list,id:id,done:true});}}
  else if(a==='gac'&&GT()){var cn2=val('cn'),cl2=val('cl')||TK.chores.id;if(cn2&&cl2){var st2=Math.max(1,parseInt(val('cs'),10)||1);TK.chores.items.push({id:'tmp'+uid(),title:cn2+' ('+st2+')',done:false,list:cl2});tkPost({op:'add',list:cl2,title:cn2+' ('+st2+')'});}}
  else if(a==='gdc'&&GT()){var cd=find(TK.chores.items,id);if(cd&&id.indexOf('tmp')!==0){TK.chores.items=not(TK.chores.items,id);tkPost({op:'delete',list:cd.list,id:id});}}
  else if(a==='lcfg'){if(!S.gcfg)S.gcfg={where:{}};S.gcfg.where[id]=t.getAttribute('data-w');setTimeout(tasksLoad,0);}
  else if(a==='addt'){var tx=val('tt');if(tx)S.tasks.push({id:uid(),text:tx,done:false});}
  else if(a==='tgt'){r=find(S.tasks,id);if(r)r.done=!r.done;}
  else if(a==='delt'){S.tasks=not(S.tasks,id);}
  else if(a==='clrt'){S.tasks=S.tasks.filter(function(x){return !x.done;});}
  else if(a==='addm'){var rt=val('rt');if(rt)S.rem.push({id:uid(),text:rt,when:val('rw')});}
  else if(a==='delm'){S.rem=not(S.rem,id);}
  else if(a==='edit'){edit=!edit;pick='';}
  else if(a==='tog'){c=find(S.chores,id);if(c){if(c.doneOn===T){p=find(S.people,c.doneBy);if(p)p.stars=Math.max(0,p.stars-c.stars);c.doneOn='';c.doneBy='';pick='';msg='';}else pick=(pick===id?'':id);}}
  else if(a==='who'){c=find(S.chores,id);p=find(S.people,t.getAttribute('data-p'));if(c&&p){c.doneOn=T;c.doneBy=p.id;p.stars+=c.stars;pick='';msg=p.name+' earned '+c.stars+(c.stars===1?' star':' stars')+' for '+c.name+'!';}}
  else if(a==='delc'){S.chores=not(S.chores,id);}
  else if(a==='addc'){var n2=val('cn');if(n2)S.chores.push({id:uid(),name:n2,stars:Math.max(1,parseInt(val('cs'),10)||1),doneOn:'',doneBy:''});}
  else if(a==='adj'){p=find(S.people,id);if(p)p.stars=Math.max(0,p.stars+parseInt(t.getAttribute('data-n'),10));}
  else if(a==='delp'){if(armed===id){S.people=not(S.people,id);armed='';}else armed=id;}
  else if(a==='addp'){var nm=val('pn');if(nm)S.people.push({id:uid(),name:nm,color:COLORS[S.people.length%COLORS.length],stars:0});}
  else if(a==='addr'){var rn=val('rn');if(rn)S.rewards.push({id:uid(),name:rn,cost:Math.max(1,parseInt(val('rc'),10)||1)});}
  else if(a==='delr'){S.rewards=not(S.rewards,id);}
  else if(a==='red'){r=find(S.rewards,id);p=find(S.people,t.getAttribute('data-p'));if(r&&p&&p.stars>=r.cost){p.stars-=r.cost;msg=p.name+' redeemed '+r.name+'! 🎉';}}
  if(JSON.stringify(S)!==before)save();
  render();
}
document.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('data-a')))t=t.parentNode;
  if(!t||t===document)return;
  act(t.getAttribute('data-a'),t);
});
S=load();render();clock();wx();pull(true);gcal();tasksLoad();
(function(){var g=(location.search.match(/[?&]google=(\w+)/)||[])[1];if(!g)return;try{history.replaceState(null,'','/');}catch(e){}
  toast({connected:'Google Tasks connected!',cancelled:'Google sign-in was cancelled.',expired:'That sign-in took too long. Please try again.',failed:'Google sign-in didn\u2019t finish. Please try again.',notsetup:'Google Tasks isn\u2019t set up in Cloudflare yet.'}[g]||'Google sign-in finished.',6000);})();
setInterval(clock,20000);setInterval(wx,1800000);setInterval(gcal,600000);setInterval(function(){pull(false);},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){pull(false);gcal();tasksLoad();}});
setInterval(function(){if(!document.hidden)tasksLoad();},60000);
setInterval(function(){if(tab==='cal'&&!busyUI())rr();},300000);
</script>
</body>
</html>
