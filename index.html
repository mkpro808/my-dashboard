<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Dashboard</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#2b2b33;--mute:#7b7f8a;--line:#e6e8ee;--ok:#16a34a;--acc:#7c5cdb;--side:#eaf1f9;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161b;--card:#1f2027;--ink:#f1f2f6;--mute:#9a9eab;--line:#31333d;--side:#101116;--on:#1f2027}}
:root[data-theme="dark"]{--bg:#15161b;--card:#1f2027;--ink:#f1f2f6;--mute:#9a9eab;--line:#31333d;--side:#101116;--on:#1f2027}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex}
nav{width:84px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:8px 0;box-sizing:border-box}
.nb{background:none;border:0;border-radius:0;color:var(--mute);padding:12px 2px;font-size:12px;min-height:76px;cursor:pointer;margin:0}
.nb b{display:block;font-size:26px;font-weight:400;margin-bottom:2px}
.nb.on{background:var(--on);color:var(--ink);font-weight:700}
main{flex:1;min-width:0;height:100%;overflow-y:auto;box-sizing:border-box}
header{display:flex;align-items:center;padding:12px 18px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
#ttl{font-size:26px;font-weight:600}
#clk{font-size:20px;margin-left:14px}
#wx{font-size:20px;margin-left:14px}
.av{margin-left:auto;display:flex}
.av i{width:34px;height:34px;line-height:34px;border-radius:50%;text-align:center;color:#fff;font-style:normal;font-weight:700;margin-left:8px}
#app{padding:12px 18px 90px}
h1{font-size:24px;margin:0}
h3{font-size:18px;margin:16px 0 8px}
button,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-height:48px;cursor:pointer}
button[disabled]{opacity:.4}
input{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px;min-width:0;flex:1;margin-right:8px;min-height:44px;box-sizing:border-box}
select{flex:1;min-width:0;margin-right:8px}
input.n{flex:none;width:70px}
.row{display:flex;align-items:center;margin:8px 0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top button{margin-right:6px}
.x{min-height:40px;padding:4px 10px;margin-left:8px}
.msg{min-height:24px;font-weight:600;color:var(--ok)}
.hint{color:var(--mute);font-size:14px}.sub{font-size:13px;color:var(--mute)}
.sch{display:flex}
.tl{width:54px;flex:none}
.tl div{height:50px;font-size:12px;color:var(--mute);text-align:right;padding-right:8px;box-sizing:border-box;position:relative;top:-7px}
.tl .sp{height:67px;top:130px;position:sticky;background:var(--bg);z-index:3}
.dc{flex:1;min-width:0;border-left:1px solid var(--line)}
.dh{height:66px;text-align:center;font-size:20px;padding-top:6px;box-sizing:border-box;position:sticky;top:130px;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.ctop{position:sticky;top:59px;height:71px;margin:-12px -18px 0;padding:12px 18px;box-sizing:border-box;background:var(--bg);z-index:4;display:flex;align-items:center;justify-content:space-between}
.ctop button{margin-right:6px}
header{height:59px;box-sizing:border-box}
.dh b{display:inline-block;min-width:34px;height:34px;line-height:34px;border-radius:17px;font-weight:600}
.dh.t b{background:#e5654b;color:#fff}
.db{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 50px}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 7px;font-size:14px;overflow:hidden;cursor:pointer;box-sizing:border-box;border-left:4px solid}
.ad{display:block;border-radius:6px;font-size:12px;padding:0 4px;margin:2px 4px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.nl{position:absolute;left:0;right:0;height:2px;background:#e5654b;pointer-events:none}
.fab{position:fixed;right:22px;bottom:22px;width:64px;height:64px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:38px;line-height:1;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:8}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
.mo{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:100%;overflow-y:auto;box-sizing:border-box}
.mo h3{margin-top:0}
.slp{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;color:#555;z-index:30;display:flex;align-items:center;justify-content:center;font-size:18px}
.it{display:flex;align-items:center;min-height:52px;background:var(--card);border:2px solid var(--line);border-radius:14px;margin:6px 0;padding:4px 10px;cursor:pointer}
.it.done{background:rgba(22,163,74,.15);border-color:var(--ok)}
.it.done .cn{text-decoration:line-through;color:var(--mute)}
.it.late{border-color:#ef4444}
.chk{width:30px;height:30px;line-height:30px;text-align:center;border:2px solid var(--mute);border-radius:50%;margin-right:12px;font-weight:700;flex:none}
.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.cn{flex:1;font-size:19px}
.cs{font-weight:700;margin-left:8px;white-space:nowrap}
.who{padding:6px 0 4px 42px}
.wb{margin:3px 8px 3px 0;border-width:3px}
.score{display:flex;flex-wrap:wrap;margin:0 -5px}
.sc{flex:1 1 140px;margin:5px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:14px;padding:10px 14px;box-sizing:border-box}
.sn{font-size:20px;font-weight:700}.ss{font-size:28px;font-weight:700}
.rw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.rt{font-size:18px;font-weight:600;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:16px;z-index:40;max-width:80%;text-align:center;display:none;cursor:pointer}
.gst{font-size:13px;color:var(--mute);margin-left:12px;font-weight:400}
.ev.g{border-left-style:solid}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="mn"><header><div id="ttl"></div><div id="clk"></div><div id="wx"></div><div class="av" id="av"></div></header><div id="app"></div></main>
<div id="ovl"></div><div id="toast" data-a="toast"></div>
<script>
var KEY='chorestars.v2', COLORS=['#f59e0b','#3b82f6','#ec4899','#10b981','#8b5cf6','#ef4444'];
var TABS=[['cal','📅','Calendar'],['chores','⭐','Chores'],['tasks','✅','Lists'],['rem','🔔','Reminders']];
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], H0=7, H1=22, PX=50, DEFTITLE='Sombrio Ohana';
var TK=null, tkSel='', api=/^https?:$/.test(location.protocol), ver=0, busy=false, dirty=false, failed=false, pushT=null, GE=[], gErr=[], gN=-1, toastT=null;
var tab='cal', edit=false, armed='', pick='', msg='', S, mo=null, wkStart=iso(new Date()), toNow=true;
function p2(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function mins(t){var a=t.split(':');return parseInt(a[0],10)*60+parseInt(a[1],10);}
function hhmm(m){return p2(Math.floor(m/60)%24)+':'+p2(m%60);}
function tf(t){var m=mins(t),h=Math.floor(m/60),ap=h<12?'AM':'PM';h=h%12||12;return h+(m%60?':'+p2(m%60):'')+' '+ap;}
function uid(){return 'i'+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function seed(){
  var c=[['Wash the dishes',2],['Take out the trash',2],['Do a load of laundry',3],['Vacuum the living room',3],['Wipe the counters',1],['Water the plants',1]];
  return {people:[{id:uid(),name:'Jericho',color:COLORS[0],stars:0},{id:uid(),name:'Kahoku',color:COLORS[1],stars:0}],
    chores:c.map(function(x){return {id:uid(),name:x[0],stars:x[1],doneOn:'',doneBy:''};}),
    rewards:[{id:uid(),name:'Pick the movie',cost:8},{id:uid(),name:'Treat of your choice',cost:12},{id:uid(),name:'Skip a chore',cost:15}]};}
function norm(s){s=s||seed();s.people=s.people||[];s.chores=s.chores||[];s.rewards=s.rewards||[];s.events=s.events||[];s.tasks=s.tasks||[];s.rem=s.rem||[];s.title=s.title||DEFTITLE;s.cdone=s.cdone||{};return s;}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}return norm(s);}
function cache(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){cache();if(!api)return;dirty=true;clearTimeout(pushT);pushT=setTimeout(push,300);}
function toast(t,ms){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toastT);if(ms!==0)toastT=setTimeout(function(){el.style.display='none';},ms||4000);}
function getJSON(u){return fetch(u,{cache:'no-store',credentials:'same-origin'}).then(function(r){var ct=r.headers.get('content-type')||'';if(r.redirected||ct.indexOf('json')<0)throw new Error('auth');return r.json().then(function(j){return {s:r.status,j:j};});});}
function busyUI(){var a=document.activeElement;return !!(mo||pick||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)));}
function rr(){var m=document.getElementById('mn'),y=m.scrollTop;render();m.scrollTop=y;}
function push(){
  if(!api)return; if(busy){return;} busy=true; dirty=false;
  fetch('/api/state',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:S,version:ver})})
  .then(function(r){var ct=r.headers.get('content-type')||'';if(r.redirected||ct.indexOf('json')<0)throw new Error('auth');return r.json().then(function(j){
    failed=false;
    if(r.status===200){ver=j.version;}
    else if(r.status===409){if(j.data){S=norm(j.data);ver=j.version;cache();}dirty=false;toast('Someone just changed this on another device. Please try that again.');rr();}
    else if(r.status===503){api=false;}
    else throw new Error('save');});})
  .catch(function(e){dirty=true;failed=true;if(e.message==='auth')toast('Your sign-in expired. Tap here to sign in again.',0);})
  .then(function(){busy=false;if(dirty)setTimeout(push,failed?15000:50);});
}
function pull(first){
  if(!api||busy||dirty)return;
  getJSON('/api/state').then(function(x){
    if(x.s===503){api=false;return;} if(x.s!==200)return;
    if(x.j.data===null){if(first){ver=0;dirty=true;push();}return;}
    if(x.j.version!==ver){S=norm(x.j.data);ver=x.j.version;cache();if(!busyUI())rr();}
  }).catch(function(e){if(e.message==='auth')toast('Your sign-in expired. Tap here to sign in again.',0);});
}
function gcal(){
  if(!api)return;
  getJSON('/api/calendar').then(function(x){if(x.s!==200)return;GE=x.j.events||[];gErr=x.j.errors||[];gN=x.j.calendars||0;if(tab==='cal'&&!busyUI())rr();}).catch(function(){});
}
function pid(name){for(var i=0;i<S.people.length;i++){if(S.people[i].name.toLowerCase()===String(name||'').toLowerCase())return S.people[i].id;}return '';}
function find(a,id){for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}return null;}
function val(id){var el=document.getElementById(id);return el?el.value.replace(/^\s+|\s+$/g,''):'';}
function not(a,id){return a.filter(function(x){return x.id!==id;});}
function pc(id){var p=find(S.people,id);return p?p.color:'#8b5cf6';}

function clock(){var d=new Date(),h=d.getHours()%12||12;document.getElementById('clk').textContent=h+':'+p2(d.getMinutes())+' '+(d.getHours()<12?'AM':'PM');}
function wx(){try{fetch('https://api.open-meteo.com/v1/forecast?latitude=21.3&longitude=-157.8&current=temperature_2m,weather_code&temperature_unit=fahrenheit')
  .then(function(r){return r.json();}).then(function(j){var c=j.current.weather_code,e=c===0?'☀️':c<4?'⛅':c<50?'🌫️':c<70?'🌧️':c<80?'❄️':c<90?'🌦️':'⛈️';
  document.getElementById('wx').textContent=e+' '+Math.round(j.current.temperature_2m)+'°';}).catch(function(){});}catch(e){}}

function dayEvents(k){
  var a=S.events.filter(function(e){return e.date===k;});
  GE.forEach(function(g){if(g.date===k)a.push({id:'g:'+g.id,title:g.title,date:g.date,time:g.time,end:g.end,who:pid(g.cal),g:1});});
  return a;}
function vCal(){
  var days=[0,1,2,3].map(function(i){return addDays(wkStart,i);}), T=iso(new Date()), nd=new Date(), nm=nd.getHours()*60+nd.getMinutes(), h, hr;
  var d0=new Date(days[0]+'T12:00:00');
  H0=7;H1=22;days.forEach(function(k){dayEvents(k).forEach(function(e){if(!e.time)return;var s=mins(e.time),en=e.end?mins(e.end):s+60;H0=Math.min(H0,Math.floor(s/60));H1=Math.max(H1,Math.min(24,Math.ceil(en/60)));});});
  var gs=!api?'':gN===0?'Google Calendar not connected yet':gErr.length?'Couldn\u2019t load: '+gErr.join(', '):'';
  h='<div class="ctop"><div><button data-a="wk" data-n="-4">◀</button><button data-a="wk" data-n="0">Today</button><button data-a="wk" data-n="4">▶</button></div><b style="font-size:18px">'+MN[d0.getMonth()]+' '+d0.getFullYear()+(gs?'<span class="gst">'+esc(gs)+'</span>':'')+'</b></div><div class="sch"><div class="tl"><div class="sp"></div>';
  for(hr=H0;hr<H1;hr++)h+='<div>'+(hr%12||12)+' '+(hr<12?'AM':'PM')+'</div>';
  h+='</div>';
  days.forEach(function(k){
    var dd=new Date(k+'T12:00:00'), ev=dayEvents(k);
    h+='<div class="dc"><div class="dh'+(k===T?' t':'')+'">'+DN[dd.getDay()]+' <b>'+dd.getDate()+'</b>';
    ev.filter(function(e){return !e.time;}).forEach(function(e){h+='<span class="ad" data-a="evt" data-i="'+esc(e.id)+'" style="background:'+pc(e.who)+'33">'+esc(e.title)+'</span>';});
    h+='</div><div class="db" data-a="newat" data-d="'+k+'" style="height:'+((H1-H0)*PX)+'px">';
    var tl=ev.filter(function(e){return e.time;}).map(function(e){var s=mins(e.time),en=e.end?mins(e.end):s+60;if(en<=s)en=s+30;return {e:e,s:s,en:en};}).sort(function(a,b){return a.s-b.s||b.en-a.en;});
    var grp=null,gEnd=-1;
    tl.forEach(function(x){if(x.s>=gEnd){grp={lanes:[],items:[]};gEnd=x.en;}else gEnd=Math.max(gEnd,x.en);var l=0;while(grp.lanes[l]>x.s)l++;grp.lanes[l]=x.en;x.l=l;x.g=grp;grp.items.push(x);});
    tl.forEach(function(x){
      var e=x.e, n=x.g.lanes.length, top=(x.s-H0*60)/60*PX, ht=Math.max(30,(x.en-x.s)/60*PX), c=pc(e.who);
      h+='<div class="ev'+(e.g?' g':'')+'" data-a="evt" data-i="'+esc(e.id)+'" style="top:'+top+'px;height:'+ht+'px;left:calc('+(x.l*100/n)+'% + 2px);width:calc('+(100/n)+'% - 4px);right:auto;background:'+c+'33;border-color:'+c+'"><b>'+esc(e.title)+'</b><br><span class="sub">'+tf(e.time)+(e.end?' - '+tf(e.end):'')+'</span></div>';});
    if(k===T&&nm>=H0*60&&nm<H1*60)h+='<div class="nl" style="top:'+((nm-H0*60)/60*PX)+'px"></div>';
    h+='</div></div>';});
  return h+'</div><button class="fab" data-a="new">+</button>';}

function vModal(){
  if(!mo)return '';
  if(mo.ro){var g=mo.g;return '<div class="ov"><div class="mo"><h3>'+esc(g.title)+'</h3><p style="font-size:18px;margin:0 0 6px">'+new Date(g.date+'T12:00:00').toDateString()+'<br>'+(g.time?tf(g.time)+(g.end?' - '+tf(g.end):''):'All day')+'</p>'+(g.loc?'<p class="hint">\uD83D\uDCCD '+esc(g.loc)+'</p>':'')+'<p class="hint">From '+esc(g.cal)+'\u2019s Google Calendar. To change it, use Google Calendar on your phone.</p><div class="row"><button data-a="mcl">Close</button></div></div></div>';}
  var h='<div class="ov"><div class="mo"><h3>'+(mo.id?'Edit event':'New event')+'</h3><div class="row"><input id="mt" placeholder="Title" value="'+esc(mo.title)+'"></div><div class="row"><input id="md" type="date" value="'+mo.date+'"></div>';
  h+='<div class="row"><input id="ms" type="time" value="'+mo.time+'"><input id="me" type="time" value="'+mo.end+'"></div><p class="hint" style="margin:0">Leave the times empty for an all-day event.</p><div class="row"><select id="mw"><option value="">Everyone</option>';
  S.people.forEach(function(p){h+='<option value="'+p.id+'"'+(mo.who===p.id?' selected':'')+'>'+esc(p.name)+'</option>';});
  h+='</select></div><div class="row"><button data-a="msv" style="background:var(--acc);color:#fff;border-color:var(--acc)">Save</button>';
  if(mo.id)h+='<button data-a="mdl" style="margin-left:8px">Delete</button>';
  return h+'<button data-a="mcl" style="margin-left:8px">Cancel</button></div></div></div>';}

function GT(){return !!(TK&&TK.connected&&TK.chores&&!TK.error);}
function parseChore(t){var m=String(t||'').match(/^(.*?)\s*\((\d+)\s*(?:\u2B50|stars?)?\)\s*$/i);return m?{name:m[1]||t,n:Math.max(1,parseInt(m[2],10))}:{name:t||'(untitled)',n:1};}
function tasksLoad(){
  if(!api)return;
  getJSON('/api/tasks').then(function(x){
    var j=x.j; if(x.s===503){TK={connected:false,configured:false};}
    else if(x.s!==200&&!j.connected){TK=j;}
    else {TK=j;}
    if(GT()){
      var T=today(),ch=false;for(var k in S.cdone){if(S.cdone[k].on!==T){delete S.cdone[k];ch=true;}}
      if(TK.chores.items.length===0&&S.chores.length&&!S.choresMoved){S.choresMoved=true;ch=true;
        var q=S.chores.slice();(function next(){var c=q.shift();if(!c){tasksLoad();return;}tkPost({op:'add',list:TK.chores.id,title:c.name+' ('+c.stars+')'},next);})();}
      if(ch)save();
      if(!tkSel||!TK.lists.some(function(l){return l.id===tkSel;}))tkSel=TK.lists.length?TK.lists[0].id:'';
    }
    if((tab==='tasks'||tab==='chores')&&!busyUI())rr();
  }).catch(function(e){if(e.message==='auth')toast('Your sign-in expired. Tap here to sign in again.',0);});
}
function tkPost(body,done){
  fetch('/api/tasks',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(j.error||'Google Tasks error');return j;});})
  .then(function(){if(done)done();else tasksLoad();})
  .catch(function(e){toast('Couldn\u2019t update Google Tasks. '+e.message);tasksLoad();});
}
function curList(){if(!GT())return null;for(var i=0;i<TK.lists.length;i++)if(TK.lists[i].id===tkSel)return TK.lists[i];return TK.lists[0]||null;}
function gNote(){
  if(!api)return '';
  if(TK===null)return '<p class="hint">Loading Google Tasks\u2026</p>';
  if(TK.connected===false&&TK.configured===false)return '<p class="hint">Google Tasks isn\u2019t set up yet, so this is saved on the dashboard only.</p>';
  if(TK.connected===false)return '<div class="rw"><div class="rt">Connect Google Tasks</div><p class="hint" style="margin-top:0">Sign in once to sync lists and chores with Google Tasks.</p><button data-a="gconnect" style="background:var(--acc);color:#fff;border-color:var(--acc)">Connect Google Tasks</button></div>';
  if(TK.error)return '<p class="hint">Couldn\u2019t reach Google Tasks right now. Showing what\u2019s saved on the dashboard.</p>';
  return '';}
function vGTasks(){
  var L=curList(), h='<div class="top"><h1>Lists</h1>'+(L?'<button data-a="gcl">Clear done</button>':'')+'</div><div class="row" style="flex-wrap:wrap">';
  TK.lists.forEach(function(l){var on=L&&l.id===L.id;h+='<button class="wb" data-a="tsel" data-i="'+esc(l.id)+'" style="'+(on?'background:var(--acc);color:#fff;border-color:var(--acc)':'')+'">'+esc(l.title)+'</button>';});
  h+='</div>';
  if(L){
    h+='<div class="row"><input id="tt" placeholder="Add to '+esc(L.title)+'"><button data-a="gad">Add</button></div>';
    L.items.forEach(function(t){h+='<div class="it'+(t.done?' done':'')+'" data-a="gtg" data-i="'+esc(t.id)+'"><span class="chk">'+(t.done?'\u2713':'')+'</span><span class="cn">'+esc(t.title)+'</span><button class="x" data-a="gdl" data-i="'+esc(t.id)+'">\u2715</button></div>';});
    if(!L.items.length)h+='<p class="hint">All clear!</p>';
  }
  h+='<h3>New list</h3><div class="row"><input id="nl" placeholder="List name, like Groceries"><button data-a="gnl">Create</button></div>';
  return h+'<p class="hint">Synced with Google Tasks. Changes on your phone show up here within a minute.</p>';}

function vTasks(){
  if(GT())return vGTasks();
  var h='<div class="top"><h1>Lists</h1><button data-a="clrt">Clear done</button></div>'+gNote()+'<div class="row"><input id="tt" placeholder="New item"><button data-a="addt">Add</button></div>';
  S.tasks.forEach(function(t){h+='<div class="it'+(t.done?' done':'')+'" data-a="tgt" data-i="'+t.id+'"><span class="chk">'+(t.done?'✓':'')+'</span><span class="cn">'+esc(t.text)+'</span><button class="x" data-a="delt" data-i="'+t.id+'">✕</button></div>';});
  if(!S.tasks.length)h+='<p class="hint">All clear!</p>';
  return h;}

function vRem(){
  var n=new Date(), nowS=iso(n)+'T'+p2(n.getHours())+':'+p2(n.getMinutes());
  var h='<h1>Reminders</h1><div class="row"><input id="rt" placeholder="New reminder"><input id="rw" type="datetime-local" style="flex:none;width:220px"><button data-a="addm">Add</button></div>';
  S.rem.slice().sort(function(a,b){return (a.when||'9').localeCompare(b.when||'9');}).forEach(function(r){
    h+='<div class="it'+(r.when&&r.when<nowS?' late':'')+'"><span class="cn">'+esc(r.text)+(r.when?' <span class="sub">'+r.when.replace('T',' ')+'</span>':'')+'</span><button class="x" data-a="delm" data-i="'+r.id+'">✓ Done</button></div>';});
  if(!S.rem.length)h+='<p class="hint">No reminders.</p>';
  return h;}

function vChores(){
  var T=today(), h='<div class="top"><h1>Chore Stars</h1><button data-a="edit">'+(edit?'Done':'Edit')+'</button></div><div class="score">';
  S.people.forEach(function(p){
    h+='<div class="sc" style="border-top-color:'+p.color+'"><div class="sn">'+esc(p.name)+'</div><div class="ss">⭐ '+p.stars+'</div>';
    if(edit)h+='<div class="row"><button data-a="adj" data-i="'+p.id+'" data-n="-1">−1</button><button data-a="adj" data-i="'+p.id+'" data-n="1" style="margin-left:8px">+1</button></div><button data-a="delp" data-i="'+p.id+'">'+(armed===p.id?'Tap again to remove':'Remove')+'</button>';
    h+='</div>';});
  h+='</div><div class="msg">'+esc(msg)+'</div>'+(GT()?'':gNote())+'<h3>Today’s chores — anyone can take one</h3>';
  if(GT()){
    TK.chores.items.forEach(function(it){
      var c=parseChore(it.title), rec=S.cdone[it.id], by=rec&&rec.on===T?find(S.people,rec.by):null, d=it.done;
      h+='<div class="it'+(d?' done':'')+'" style="display:block"><div style="display:flex;align-items:center;min-height:48px" data-a="gtog" data-i="'+esc(it.id)+'"><span class="chk">'+(d?'✓':'')+'</span><span class="cn">'+esc(c.name)+(d?(by?' — '+esc(by.name):' — checked off in Google Tasks'):'')+'</span><span class="cs">+'+c.n+' ⭐</span>';
      if(edit)h+='<button class="x" data-a="gdc" data-i="'+esc(it.id)+'">✕</button>';
      h+='</div>';
      if(!d&&pick===it.id){h+='<div class="who"><span class="sub">Who did it?</span><br>';
        S.people.forEach(function(p){h+='<button class="wb" data-a="gwho" data-i="'+esc(it.id)+'" data-p="'+p.id+'" style="border-color:'+p.color+'">'+esc(p.name)+'</button>';});h+='</div>';}
      h+='</div>';});
    if(!TK.chores.items.length)h+='<p class="hint">No chores yet. Add some here, or in the “Chores” list in Google Tasks.</p>';
    if(edit)h+='<div class="row"><input id="cn" placeholder="New chore"><input class="n" id="cs" type="number" min="1" value="1"><button data-a="gac">Add</button></div>';
  } else
  S.chores.forEach(function(c){
    var d=c.doneOn===T, by=find(S.people,c.doneBy);
    h+='<div class="it'+(d?' done':'')+'" style="display:block"><div style="display:flex;align-items:center;min-height:48px" data-a="tog" data-i="'+c.id+'"><span class="chk">'+(d?'✓':'')+'</span><span class="cn">'+esc(c.name)+(d&&by?' — '+esc(by.name):'')+'</span><span class="cs">+'+c.stars+' ⭐</span>';
    if(edit)h+='<button class="x" data-a="delc" data-i="'+c.id+'">✕</button>';
    h+='</div>';
    if(!d&&pick===c.id){h+='<div class="who"><span class="sub">Who did it?</span><br>';
      S.people.forEach(function(p){h+='<button class="wb" data-a="who" data-i="'+c.id+'" data-p="'+p.id+'" style="border-color:'+p.color+'">'+esc(p.name)+'</button>';});h+='</div>';}
    h+='</div>';});
  if(edit&&!GT())h+='<div class="row"><input id="cn" placeholder="New chore"><input class="n" id="cs" type="number" min="1" value="1"><button data-a="addc">Add</button></div>';
  h+='<h3>🎁 Rewards</h3>';
  S.rewards.forEach(function(r){
    h+='<div class="rw"><div class="rt">'+esc(r.name)+' — '+r.cost+' ⭐'+(edit?' <button class="x" data-a="delr" data-i="'+r.id+'">✕</button>':'')+'</div>';
    S.people.forEach(function(p){h+='<button class="wb" data-a="red" data-i="'+r.id+'" data-p="'+p.id+'" style="border-color:'+p.color+'"'+(p.stars<r.cost?' disabled':'')+'>'+esc(p.name)+'</button>';});
    h+='</div>';});
  if(edit){h+='<div class="row"><input id="rn" placeholder="New reward"><input class="n" id="rc" type="number" min="1" value="10"><button data-a="addr">Add</button></div><h3>Add a person</h3><div class="row"><input id="pn" placeholder="Name"><button data-a="addp">Add</button></div>';}
  return h+'<p class="hint">Chores reset every morning. Tap a finished chore to undo it.'+(GT()?' Chores come from the “Chores” list in Google Tasks; put the stars at the end of the name, like “Wash the dishes (2)”.':'')+'</p>';}

function render(){
  var h='',a='';
  TABS.forEach(function(t){h+='<button class="nb'+(t[0]===tab?' on':'')+'" data-a="tab" data-i="'+t[0]+'"><b>'+t[1]+'</b>'+t[2]+'</button>';});
  h+='<button class="nb" data-a="sleep" style="margin-top:auto"><b>🌙</b>Sleep</button>';
  document.getElementById('nav').innerHTML=h;
  document.getElementById('ttl').textContent=S.title||DEFTITLE;
  S.people.forEach(function(p){a+='<i style="background:'+p.color+'">'+esc(p.name.charAt(0).toUpperCase())+'</i>';});
  document.getElementById('av').innerHTML=a;
  document.getElementById('app').innerHTML=tab==='cal'?vCal():tab==='tasks'?vTasks():tab==='rem'?vRem():vChores();
  document.getElementById('ovl').innerHTML=vModal();
  if(tab==='cal'&&toNow){toNow=false;var m=document.getElementById('mn'),n=new Date();m.scrollTop=Math.max(0,((n.getHours()-H0-1)*PX)+12);}
}

function openMo(e,d){mo=e?{id:e.id,title:e.title,date:e.date,time:e.time||'',end:e.end||'',who:e.who||''}:{id:'',title:'',date:d,time:'',end:'',who:''};}
function act(a,t){
  var id=t.getAttribute('data-i')||'', T=today(), c, p, r, before=JSON.stringify(S);
  if(a!=='tog'&&a!=='who')msg='';
  if(a!=='delp')armed='';
  if(a==='tab'){tab=id;edit=false;pick='';toNow=(id==='cal');if(id==='tasks'||id==='chores')tasksLoad();}
  else if(a==='sleep'){var s=document.createElement('div');s.className='slp';s.textContent='Tap to wake';s.onclick=function(){document.body.removeChild(s);};document.body.appendChild(s);return;}
  else if(a==='wk'){var n=parseInt(t.getAttribute('data-n'),10);wkStart=n?addDays(wkStart,n):iso(new Date());}
  else if(a==='new'){openMo(null,iso(new Date())>wkStart?iso(new Date()):wkStart);}
  else if(a==='newat'){return;}
  else if(a==='evt'){if(id.indexOf('g:')===0){var gg=find(GE,id.slice(2));if(gg)mo={ro:true,g:gg};}else openMo(find(S.events,id));}
  else if(a==='toast'){document.getElementById('toast').style.display='none';if(/sign-in/.test(t.textContent))location.reload();return;}
  else if(a==='mcl'){mo=null;}
  else if(a==='mdl'){S.events=not(S.events,mo.id);mo=null;}
  else if(a==='msv'){var ti=val('mt');if(ti){var st=val('ms'),en=val('me');if(st&&!en)en=hhmm(mins(st)+60);if(!st)en='';
    var o={id:mo.id||uid(),title:ti,date:val('md')||mo.date,time:st,end:en,who:document.getElementById('mw').value};
    if(mo.id)S.events=S.events.map(function(x){return x.id===o.id?o:x;});else S.events.push(o);mo=null;}}
  else if(a==='gconnect'){location.href='/api/google/connect';return;}
  else if(a==='tsel'){tkSel=id;}
  else if(a==='gad'){var L1=curList(),gt=val('tt');if(L1&&gt){L1.items.unshift({id:'tmp'+uid(),title:gt,done:false});tkPost({op:'add',list:L1.id,title:gt});}}
  else if(a==='gtg'){var L2=curList();if(L2){var it2=find(L2.items,id);if(it2&&id.indexOf('tmp')!==0){it2.done=!it2.done;tkPost({op:'toggle',list:L2.id,id:id,done:it2.done});}}}
  else if(a==='gdl'){var L3=curList();if(L3&&id.indexOf('tmp')!==0){L3.items=not(L3.items,id);tkPost({op:'delete',list:L3.id,id:id});}}
  else if(a==='gcl'){var L4=curList();if(L4){L4.items=L4.items.filter(function(x){return !x.done;});tkPost({op:'clear',list:L4.id});}}
  else if(a==='gnl'){var nl=val('nl');if(nl&&GT())tkPost({op:'newlist',title:nl},function(){tkSel='';tasksLoad();});}
  else if(a==='gtog'&&GT()){var ci=find(TK.chores.items,id);if(ci){if(ci.done){var rc=S.cdone[id];if(rc&&rc.on===T){p=find(S.people,rc.by);if(p)p.stars=Math.max(0,p.stars-rc.n);}delete S.cdone[id];ci.done=false;pick='';msg='';tkPost({op:'toggle',list:TK.chores.id,id:id,done:false});}else pick=(pick===id?'':id);}}
  else if(a==='gwho'&&GT()){var cw=find(TK.chores.items,id);p=find(S.people,t.getAttribute('data-p'));if(cw&&p){var pc2=parseChore(cw.title);p.stars+=pc2.n;S.cdone[id]={on:T,by:p.id,n:pc2.n};cw.done=true;pick='';msg=p.name+' earned '+pc2.n+' \u2B50 for '+pc2.name+'!';tkPost({op:'toggle',list:TK.chores.id,id:id,done:true});}}
  else if(a==='gac'&&GT()){var cn2=val('cn');if(cn2){var st2=Math.max(1,parseInt(val('cs'),10)||1);TK.chores.items.push({id:'tmp'+uid(),title:cn2+' ('+st2+')',done:false});tkPost({op:'add',list:TK.chores.id,title:cn2+' ('+st2+')'});}}
  else if(a==='gdc'&&GT()){if(id.indexOf('tmp')!==0){TK.chores.items=not(TK.chores.items,id);tkPost({op:'delete',list:TK.chores.id,id:id});}}
  else if(a==='addt'){var tx=val('tt');if(tx)S.tasks.push({id:uid(),text:tx,done:false});}
  else if(a==='tgt'){r=find(S.tasks,id);if(r)r.done=!r.done;}
  else if(a==='delt'){S.tasks=not(S.tasks,id);}
  else if(a==='clrt'){S.tasks=S.tasks.filter(function(x){return !x.done;});}
  else if(a==='addm'){var rt=val('rt');if(rt)S.rem.push({id:uid(),text:rt,when:val('rw')});}
  else if(a==='delm'){S.rem=not(S.rem,id);}
  else if(a==='edit'){edit=!edit;pick='';}
  else if(a==='tog'){c=find(S.chores,id);if(c){if(c.doneOn===T){p=find(S.people,c.doneBy);if(p)p.stars=Math.max(0,p.stars-c.stars);c.doneOn='';c.doneBy='';pick='';msg='';}else pick=(pick===id?'':id);}}
  else if(a==='who'){c=find(S.chores,id);p=find(S.people,t.getAttribute('data-p'));if(c&&p){c.doneOn=T;c.doneBy=p.id;p.stars+=c.stars;pick='';msg=p.name+' earned '+c.stars+' ⭐ for '+c.name+'!';}}
  else if(a==='delc'){S.chores=not(S.chores,id);}
  else if(a==='addc'){var n2=val('cn');if(n2)S.chores.push({id:uid(),name:n2,stars:Math.max(1,parseInt(val('cs'),10)||1),doneOn:'',doneBy:''});}
  else if(a==='adj'){p=find(S.people,id);if(p)p.stars=Math.max(0,p.stars+parseInt(t.getAttribute('data-n'),10));}
  else if(a==='delp'){if(armed===id){S.people=not(S.people,id);armed='';}else armed=id;}
  else if(a==='addp'){var nm=val('pn');if(nm)S.people.push({id:uid(),name:nm,color:COLORS[S.people.length%COLORS.length],stars:0});}
  else if(a==='addr'){var rn=val('rn');if(rn)S.rewards.push({id:uid(),name:rn,cost:Math.max(1,parseInt(val('rc'),10)||1)});}
  else if(a==='delr'){S.rewards=not(S.rewards,id);}
  else if(a==='red'){r=find(S.rewards,id);p=find(S.people,t.getAttribute('data-p'));if(r&&p&&p.stars>=r.cost){p.stars-=r.cost;msg=p.name+' redeemed '+r.name+'! 🎉';}}
  if(JSON.stringify(S)!==before)save();
  render();
}
document.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('data-a')))t=t.parentNode;
  if(!t||t===document)return;
  act(t.getAttribute('data-a'),t);
});
S=load();render();clock();wx();pull(true);gcal();tasksLoad();
(function(){var g=(location.search.match(/[?&]google=(\w+)/)||[])[1];if(!g)return;try{history.replaceState(null,'','/');}catch(e){}
  toast({connected:'Google Tasks connected!',cancelled:'Google sign-in was cancelled.',expired:'That sign-in took too long. Please try again.',failed:'Google sign-in didn\u2019t finish. Please try again.',notsetup:'Google Tasks isn\u2019t set up in Cloudflare yet.'}[g]||'Google sign-in finished.',6000);})();
setInterval(clock,20000);setInterval(wx,1800000);setInterval(gcal,600000);setInterval(function(){pull(false);},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){pull(false);gcal();tasksLoad();}});
setInterval(function(){if(!document.hidden)tasksLoad();},60000);
setInterval(function(){if(tab==='cal'&&!busyUI())rr();},300000);
</script>
